name: Update Numbers Mini

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update Numbers Mini data
        run: python update_data.py

      - name: Commit updated data
        run: |
          git config user.name "numbers-mini-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update Numbers Mini data"
          git push
